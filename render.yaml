services:
  - type: web
    name: hiregenie-pro
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./hiregenie.db
